<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>MASTER MIND ARTIFICIAL INTELLIGENCE</title>
  <style>
    :root {
      --bg: #eef2ff;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --ink: #0f172a;
      --muted: #475569;
      --brand-1: #2563eb;
      --brand-2: #7c3aed;
      --brand-3: #ec4899;
      --mint: #059669;
      --amber: #d97706;
      --danger: #dc2626;
      --line: #dbe4ff;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(37, 99, 235, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: linear-gradient(125deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
      color: #ffffff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-md);
      z-index: 20;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: #d1fae5;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .top-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    .top-btn:active {
      transform: scale(0.97);
    }

    .key-panel {
      display: none;
      background: #fffbeb;
      border-bottom: 2px solid #f59e0b;
      padding: 10px 14px;
      gap: 8px;
      flex-direction: column;
      flex-shrink: 0;
    }

    .key-panel.open {
      display: flex;
    }

    .key-row {
      display: flex;
      gap: 8px;
    }

    input[type="password"],
    select,
    textarea {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 0.9rem;
      width: 100%;
    }

    select {
      font-weight: 700;
    }

    .btn {
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #475569;
      box-shadow: none;
    }

    .controls-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #modeSelect {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1e3a8a;
    }

    #langSelect {
      background: #f5f3ff;
      border-color: #c4b5fd;
      color: #4c1d95;
    }

    #modelSelect {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #065f46;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      background: linear-gradient(90deg, #e0e7ff, #fae8ff);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      border: 1.5px solid transparent;
    }

    .chip:nth-child(1) { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .chip:nth-child(2) { background: #d1fae5; color: #047857; border-color: #6ee7b7; }
    .chip:nth-child(3) { background: #fce7f3; color: #be185d; border-color: #f9a8d4; }
    .chip:nth-child(4) { background: #fef3c7; color: #b45309; border-color: #fcd34d; }

    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 94%;
    }

    .msg-wrap.user {
      align-self: flex-end;
    }

    .msg-wrap.ai {
      align-self: flex-start;
    }

    .msg {
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.62;
      font-size: 0.94rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg.ai {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid #c7d2fe;
      border-left: 4px solid #7c3aed;
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-left: 2px;
    }

    .action-chip {
      background: var(--surface);
      color: #3730a3;
      border: 1px solid #c7d2fe;
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      font-size: 0.78rem;
      color: #4338ca;
      font-weight: 700;
      text-align: center;
      min-height: 18px;
    }

    footer {
      background: var(--surface);
      border-top: 1.5px solid var(--line);
      padding: 8px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
      flex-shrink: 0;
    }

    .composer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .mic-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }

    .mic-btn.listening {
      background: var(--danger);
    }

    textarea {
      min-height: 44px;
      max-height: 110px;
      resize: none;
    }

    .hint {
      font-size: 0.75rem;
      color: #78350f;
      font-weight: 600;
    }
  </style>
</head>

  <header>
    <div class="brand">

    </select>
  </section>

  <div class="chips" id="quickChips">
    <button class="chip" type="button" data-prompt="भारतीय संविधान की प्रस्तावना को सरल बिंदुओं में समझाइए।">संविधान प्रस्तावना</button>
    <button class="chip" type="button" data-prompt="सामान्य ज्ञान के 5 महत्वपूर्ण प्रश्न और उत्तर बनाइए।">5 GK प्रश्न</button>
    <button class="chip" type="button" data-prompt="आज के विषय पर 5 बहुविकल्पीय प्रश्न (MCQ) उत्तर सहित दीजिए।">MCQ प्रैक्टिस</button>
    <button class="chip" type="button" data-prompt="किसी भी विषय को जल्दी याद करने के 4 प्रभावी नियम बताइए।">याद करने के नियम</button>
  </div>

  <main id="chatBox"></main>

  <footer>
    <div class="status" id="statusText"></div>
    <div class="composer">
      <button class="mic-btn" id="micBtn" type="button" title="बोलकर लिखें" aria-label="बोलकर लिखें">🎙️</button>
      <textarea id="promptInput" placeholder="यहाँ लिखें या 🎙️ बोलें..."></textarea>
      <button class="btn" id="sendBtn" type="button">भेजें ➤</button>
    </div>
  </footer>
